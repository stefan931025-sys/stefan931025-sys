name: Autonomous Portfolio Sync

on:
  push:
    branches:
      - main
  # Triggered when commits are pushed to your other project repositories
  repository_dispatch:
    types: [portfolio_update_event]
  # Runs automatically every night at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allows a manual trigger button in GitHub Actions UI
  workflow_dispatch:

jobs:
  sync-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Portfolio Update Script
        run: |
          python update_portfolio.py

      - name: Commit Updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Portfolio Sync: Updated README [skip ci]"
          branch: main
