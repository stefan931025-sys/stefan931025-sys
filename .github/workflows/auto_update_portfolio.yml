name: Autonomous Portfolio Sync

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [portfolio_update_event]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Portfolio Update Script
        env:
          PORTFOLIO_DRIVE_URL: ${{ vars.PORTFOLIO_DRIVE_URL }}
        run: |
          python update_portfolio.py

      - name: Update Repo Metadata & Topics
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }} \
            -d '{
              "description": "Quantitative & Discretionary Macro Portfolio | Volatility Engines, Systematic Trading & Buy-Side Financial Modeling",
              "topics": ["quantitative-finance", "trading-systems", "macroeconomics", "garch", "equity-research", "financial-modeling"]
            }'

      - name: Commit Updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Portfolio Sync: Updated README & Metadata [skip ci]"
          branch: main
